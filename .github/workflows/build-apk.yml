name: Build TPS Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK from current source
        run: gradle -p . assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TPS-Manager-Android-98.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TPS-Manager-Android-98.1.0
          path: TPS-Manager-Android-98.1.0.apk
