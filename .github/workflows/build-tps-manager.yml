name: Build TPS Manager APK
# rebuild 2026-09-24

on:
  workflow_dispatch:
  push:
    branches: [main, tps-manager-build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable debug APK
        run: gradle :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TPS_Manager.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TPS-Manager-APK
          path: TPS_Manager.apk
          if-no-files-found: error
