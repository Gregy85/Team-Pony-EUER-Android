name: Build TPS Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "Using Android build tools $BUILD_TOOLS_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install real Team Pony launcher icon
        shell: bash
        run: |
          set -euo pipefail
          ICON_URL="https://phenomenal-sfogliatella-09cbcb.netlify.app/assets/tps-manager-v73-192.png"
          curl --fail --location --retry 3 "$ICON_URL" -o /tmp/teampony.png
          file /tmp/teampony.png | grep -F "PNG image data"
          test "$(stat -c%s /tmp/teampony.png)" -gt 10000
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f app/src/main/res/drawable/ic_launcher.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$d"
            cp /tmp/teampony.png "app/src/main/res/mipmap-$d/ic_launcher.png"
            cp /tmp/teampony.png "app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml

      - name: Clean old build output
        run: rm -rf app/build TPS_Manager.apk

      - name: Build fresh APK without build cache
        run: gradle --no-build-cache clean :app:assembleDebug

      - name: Copy freshly built APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TPS_Manager.apk

      - name: Verify package label and launcher icon reference
        run: |
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          "$AAPT" dump badging TPS_Manager.apk | tee apk-badging.txt
          grep -F "package: name='de.teampony.tpsmanager'" apk-badging.txt
          grep -F "application-label:'TPS Manager'" apk-badging.txt
          grep -E "application-icon-[0-9]+:'res/" apk-badging.txt

      - name: Verify Team Pony launcher icon is packaged
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          "$AAPT" dump resources TPS_Manager.apk > apk-resources.txt
          grep -F "ic_launcher" apk-resources.txt
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            grep -F "res/mipmap-$d-v4/ic_launcher.png type=PNG" apk-resources.txt
            grep -F "res/mipmap-$d-v4/ic_launcher_round.png type=PNG" apk-resources.txt
          done

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs TPS_Manager.apk

      - name: Verify APK size
        run: |
          SIZE=$(stat -c%s TPS_Manager.apk)
          echo "TPS_Manager.apk size: $SIZE bytes"
          test "$SIZE" -gt 50000

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: TPS-Manager-APK-VERIFIED
          path: TPS_Manager.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: TPS-Manager-APK-Verification
          path: |
            apk-badging.txt
            apk-resources.txt
          retention-days: 30
