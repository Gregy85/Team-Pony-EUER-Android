name: Build TPS Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "Using Android build tools $BUILD_TOOLS_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install exact known-good Team Pony launcher icon
        shell: bash
        run: |
          set -euo pipefail
          ICON_URL="https://phenomenal-sfogliatella-09cbcb.netlify.app/assets/tps-manager-v73-192.png"
          ICON_SHA256="db851101295694d229525705c69ed43e2e2d7144c4f5fc8d6e6867a0c0270472"
          curl --fail --location --retry 3 "$ICON_URL" -o /tmp/teampony.png
          file /tmp/teampony.png | grep -F "PNG image data"
          echo "$ICON_SHA256  /tmp/teampony.png" | sha256sum -c -
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f app/src/main/res/drawable/ic_launcher.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$d"
            cp /tmp/teampony.png "app/src/main/res/mipmap-$d/ic_launcher.png"
            cp /tmp/teampony.png "app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done
          test -s app/src/main/res/drawable/tps_launcher_9812.xml
          grep -q 'android:src="@mipmap/ic_launcher"' app/src/main/res/drawable/tps_launcher_9812.xml
          grep -q 'android:icon="@drawable/tps_launcher_9812"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/tps_launcher_9812"' app/src/main/AndroidManifest.xml

      - name: Restore persistent TPS signing key
        shell: bash
        env:
          TPS_KEYSTORE_B64: ${{ secrets.TPS_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${TPS_KEYSTORE_B64:-}"
          printf '%s' "$TPS_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tps-manager.jks"

      - name: Clean old build output
        run: rm -rf app/build TPS_Manager-unsigned.apk TPS_Manager-aligned.apk TPS_Manager.apk

      - name: Build fresh APK without build cache
        run: gradle --no-build-cache clean :app:assembleDebug

      - name: Sign APK with persistent TPS key
        shell: bash
        env:
          TPS_KEY_ALIAS: ${{ secrets.TPS_KEY_ALIAS }}
          TPS_KEYSTORE_PASSWORD: ${{ secrets.TPS_KEYSTORE_PASSWORD }}
          TPS_KEY_PASSWORD: ${{ secrets.TPS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TPS_KEY_ALIAS:-}"
          test -n "${TPS_KEYSTORE_PASSWORD:-}"
          test -n "${TPS_KEY_PASSWORD:-}"
          cp app/build/outputs/apk/debug/app-debug.apk TPS_Manager-unsigned.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign" -f -p 4 TPS_Manager-unsigned.apk TPS_Manager-aligned.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" sign             --ks "$RUNNER_TEMP/tps-manager.jks"             --ks-key-alias "$TPS_KEY_ALIAS"             --ks-pass "pass:$TPS_KEYSTORE_PASSWORD"             --key-pass "pass:$TPS_KEY_PASSWORD"             --out TPS_Manager.apk TPS_Manager-aligned.apk

      - name: Verify package label and launcher icon reference
        run: |
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          "$AAPT" dump badging TPS_Manager.apk | tee apk-badging.txt
          grep -F "package: name='de.teampony.tpsmanager'" apk-badging.txt
          grep -F "application-label:'TPS Manager'" apk-badging.txt
          grep -E "application-icon-[0-9]+:'res/" apk-badging.txt

      - name: Verify exact Team Pony icon bytes inside APK
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          ICON_SHA256="db851101295694d229525705c69ed43e2e2d7144c4f5fc8d6e6867a0c0270472"
          "$AAPT" dump resources TPS_Manager.apk > apk-resources.txt
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            ICON_PATH="res/mipmap-$d-v4/ic_launcher.png"
            ROUND_PATH="res/mipmap-$d-v4/ic_launcher_round.png"
            unzip -p TPS_Manager.apk "$ICON_PATH" > "/tmp/icon-$d.png"
            unzip -p TPS_Manager.apk "$ROUND_PATH" > "/tmp/icon-round-$d.png"
            echo "$ICON_SHA256  /tmp/icon-$d.png" | sha256sum -c -
            echo "$ICON_SHA256  /tmp/icon-round-$d.png" | sha256sum -c -
          done

      - name: Verify exact persistent APK signature
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs TPS_Manager.apk | tee apk-signature.txt
          grep -F "certificate SHA-256 digest: b2af1d9febc11381892740b21e2f466ca9236e983a715873e43c3f804d35b742" apk-signature.txt

      - name: Verify APK size
        run: |
          SIZE=$(stat -c%s TPS_Manager.apk)
          echo "TPS_Manager.apk size: $SIZE bytes"
          test "$SIZE" -gt 50000

      - name: Read APK version for artifact name
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle | head -1)
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: TPS-Manager-Android-${{ env.APP_VERSION }}-VERIFIED
          path: TPS_Manager.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: TPS-Manager-APK-Verification
          path: |
            apk-badging.txt
            apk-resources.txt
            apk-signature.txt
          retention-days: 30
